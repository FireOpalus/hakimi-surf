services:
  hakimi-plugin-weather:
    image: hakimi-plugin-common:latest
    build:
      context: .
      dockerfile: plugins/Dockerfile
    command: ["python", "-m", "plugins.weather.plugin_main"]
    env_file:
      - path: ./secrets/plugins.env
        required: false
    environment:
      HAKIMI_PLUGIN_WS_URL: "ws://hakimi-bot:12141/ws/plugin"
      TZ: "Asia/Shanghai"
    depends_on:
      hakimi-bot:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pathlib,sys\nme=str(os.getpid());t=b'plugins.weather.plugin_main'\nfor p in pathlib.Path('/proc').iterdir():\n if p.name.isdigit() and p.name!=me:\n  try:\n   if t in (p/'cmdline').read_bytes():sys.exit(0)\n  except OSError:pass\nsys.exit(1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

