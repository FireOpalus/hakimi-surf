services:
  hakimi-node-agent:
    image: hakimi-node-agent:v2.0
    env_file: .env.node
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=700,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
