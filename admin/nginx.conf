worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript;
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream engine {
        zone engine 64k;
        server hakimi-bot:12141 resolve;
    }

    server {
        listen 8080;
        charset utf-8;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_next_upstream off;
        proxy_read_timeout 900s;
        proxy_buffering off;

        location = /healthz { return 200 "ok\n"; }

        # The engine owns the enabled/Host/Origin check for the login document.
        location = /_admin_access {
            internal;
            proxy_method GET;
            proxy_set_header Accept application/json;
            proxy_pass_request_body off;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_set_header Authorization "";
            proxy_pass http://engine/admin;
        }

        location ~ ^/admin/?$ {
            if ($args != "") { return 400; }
            limit_except GET { deny all; }
            auth_request /_admin_access;
            error_page 500 =503 @engine_unavailable;
            root /srv/admin;
            try_files /admin_page.html =404;
            default_type text/html;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            include /etc/nginx/admin-csp.conf;
        }

        location @engine_unavailable { return 503; }

        location = /admin/api/colab/drive/inbox {
            client_max_body_size 100m;
            proxy_request_buffering off;
            proxy_pass http://engine/admin/api/colab/drive/inbox;
        }

        location = /admin/api/songs/upload {
            client_max_body_size 100m;
            proxy_request_buffering off;
            proxy_pass http://engine/admin/api/songs/upload;
        }

        location /admin/api/ {
            proxy_pass http://engine/admin/api/;
        }

        location / { return 404; }
    }
}
