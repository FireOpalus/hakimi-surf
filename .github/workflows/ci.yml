name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned capability revision
        id: modules
        run: echo "sha=$(git rev-parse HEAD:src/hakimi/modules)" >> "$GITHUB_OUTPUT"
      - name: Check out private capability modules
        uses: actions/checkout@v4
        with:
          repository: FireOpalus/hakimi-modules
          ref: ${{ steps.modules.outputs.sha }}
          path: src/hakimi/modules
          ssh-key: ${{ secrets.HAKIMI_MODULES_DEPLOY_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Provide Nginx for the admin release integration test
        run: |
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends nginx
          fi
      - run: uv run pytest -q
