name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.catalog.outputs.sha }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: catalog
        run: |
          sha=$(git rev-parse HEAD:src/hakimi/modules)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hakimi-modules
          ref: ${{ steps.catalog.outputs.sha }}
          path: src/hakimi/modules
          ssh-key: ${{ secrets.HAKIMI_MODULES_DEPLOY_KEY }}
          persist-credentials: false
      - id: platforms
        run: |
          matrix=$(python3 scripts/platform_checkout.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  platform:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    name: Fetch ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          ssh-key: ${{ secrets[format('HAKIMI_MODULE_{0}_DEPLOY_KEY', matrix.key_suffix)] }}
          persist-credentials: false
      - name: Export the pinned source
        env:
          PLATFORM: ${{ matrix.name }}
        run: git archive --format=tar --output="$RUNNER_TEMP/$PLATFORM.tar" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 1

  offline-tests:
    needs: [catalog, platform]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hakimi-modules
          ref: ${{ needs.catalog.outputs.sha }}
          path: src/hakimi/modules
          ssh-key: ${{ secrets.HAKIMI_MODULES_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-*
          path: ${{ runner.temp }}/platform-archives
          merge-multiple: true
      - run: python3 scripts/platform_checkout.py restore "$RUNNER_TEMP/platform-archives"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python admin/build.py
      - run: uv run python admin/build.py --check --verify-file
      - run: uv run python admin/csp.py
      - name: Provide Nginx for the admin release integration test
        run: |
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends nginx
          fi
      - run: bash scripts/test_fast.sh -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose configurations
        run: |
          set -euo pipefail
          cleanup() {
            rm -f .env secrets/voice-gateway.env secrets/plugins.env
            rmdir secrets 2>/dev/null || true
          }
          trap cleanup EXIT
          cp .env.example .env
          mkdir -p secrets
          cp .env.voice-gateway.example secrets/voice-gateway.env
          : > secrets/plugins.env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.plugins.yaml config -q
          docker compose -f compose.yaml -f compose.voice-gateway.yaml config -q
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Lint Dockerfiles with BuildKit checks
        run: |
          set -euo pipefail
          docker buildx build --check -f Dockerfile .
          docker buildx build --check -f admin/Dockerfile ./admin
          docker buildx build --check -f plugins/Dockerfile .
          docker buildx build --check -f plugins/doc_render/Dockerfile .
          docker buildx build --check -f plugins/song_finder/Dockerfile .
          docker buildx build --check -f voice_gateway/Dockerfile .
      - name: Build hakimi-admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: admin/Dockerfile
          load: true
          tags: hakimi-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin,ignore-error=true
      - name: Verify hakimi-admin Nginx config
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:size=32m,mode=1777 --cap-drop ALL
          hakimi-admin:ci -t
      - name: Build hakimi-voice-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: voice_gateway/Dockerfile
          push: false
          cache-from: type=gha,scope=voice-gateway
          cache-to: type=gha,mode=max,scope=voice-gateway,ignore-error=true
