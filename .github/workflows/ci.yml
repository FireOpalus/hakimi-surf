name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned capability revision
        id: modules
        run: echo "sha=$(git rev-parse HEAD:src/hakimi/modules)" >> "$GITHUB_OUTPUT"
      - name: Check out the module catalog
        uses: actions/checkout@v4
        with:
          repository: FireOpalus/hakimi-modules
          ref: ${{ steps.modules.outputs.sha }}
          path: src/hakimi/modules
          ssh-key: ${{ secrets.HAKIMI_MODULES_DEPLOY_KEY }}
          persist-credentials: false
      - name: Read the four module revisions from the catalog
        id: platforms
        working-directory: src/hakimi/modules
        run: |
          for platform in qq bilibili minecraft weather; do
            echo "$platform=$(git rev-parse "HEAD:platforms/$platform")" >> "$GITHUB_OUTPUT"
          done
      - name: Check out qq
        uses: actions/checkout@v4
        with:
          repository: FireOpalus/hakimi-module-qq
          ref: ${{ steps.platforms.outputs.qq }}
          path: src/hakimi/modules/platforms/qq
          ssh-key: ${{ secrets.HAKIMI_MODULE_QQ_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out bilibili
        uses: actions/checkout@v4
        with:
          repository: FireOpalus/hakimi-module-bilibili
          ref: ${{ steps.platforms.outputs.bilibili }}
          path: src/hakimi/modules/platforms/bilibili
          ssh-key: ${{ secrets.HAKIMI_MODULE_BILIBILI_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out minecraft
        uses: actions/checkout@v4
        with:
          repository: FireOpalus/hakimi-module-minecraft
          ref: ${{ steps.platforms.outputs.minecraft }}
          path: src/hakimi/modules/platforms/minecraft
          ssh-key: ${{ secrets.HAKIMI_MODULE_MINECRAFT_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out weather
        uses: actions/checkout@v4
        with:
          repository: FireOpalus/hakimi-module-weather
          ref: ${{ steps.platforms.outputs.weather }}
          path: src/hakimi/modules/platforms/weather
          ssh-key: ${{ secrets.HAKIMI_MODULE_WEATHER_DEPLOY_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Provide Nginx for the admin release integration test
        run: |
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends nginx
          fi
      - run: uv run pytest -q
