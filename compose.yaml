services:
  hakimi-bot:
    build: .
    ports:
      - '127.0.0.1:12141:12141'
    env_file: .env
    environment:
      HAKIMI_DATA_DIR: /app/data
      TZ: Asia/Shanghai
      BOT_TIMEZONE: Asia/Shanghai
    volumes:
      - hakimi-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /tmp/bili_video_cache:size=256m,uid=10001,gid=10001,mode=700,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  hakimi-data:
