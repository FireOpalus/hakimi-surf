# Include from nginx's http {} context (e.g. sites-enabled/hakimi-ws.conf).
# Replace domain, certificate paths and random suffix before enabling.
# Keep the SAME complete path in offshore ONEBOT_WS_PATH and the domestic OneBot url.
map $http_upgrade $hakimi_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qq.example.com;
    ssl_certificate /etc/letsencrypt/live/qq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qq.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Do not persist the random path or Authorization header in access logs.
    access_log off;
    client_max_body_size 20m;

    location = /ws/onebot/REPLACE_WITH_48_RANDOM_HEX_CHARS {
        # Optional source allowlist; keep the domestic node's stable outbound IPv4/IPv6 up to date.
        # allow <DOMESTIC_VPS_PUBLIC_IP>;
        # deny all;
        if ($http_upgrade != "websocket") { return 404; }
        # No URI component: preserve the exact custom backend route.
        proxy_pass http://127.0.0.1:12141;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hakimi_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Self-ID $http_x_self_id;
        proxy_set_header X-Client-Role $http_x_client_role;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Keep the SAME complete path in offshore NODE_WS_PATH and the domestic node_agent NODE_WS_URL.
    location = /ws/node/REPLACE_WITH_48_RANDOM_HEX_CHARS {
        # Optional source allowlist; keep the domestic node's stable outbound IPv4/IPv6 up to date.
        # allow <DOMESTIC_VPS_PUBLIC_IP>;
        # deny all;
        if ($http_upgrade != "websocket") { return 404; }
        # No URI component: preserve the exact custom backend route.
        proxy_pass http://127.0.0.1:12141;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hakimi_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Node-ID $http_x_node_id;
        proxy_set_header X-Node-Region $http_x_node_region;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Includes /admin, /admin/api/*, /docs, /openapi.json and the site root.
    location / { return 404; }
}
