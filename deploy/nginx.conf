# Place limit_req_zone in the nginx http context; install a certificate before enabling.
limit_req_zone $binary_remote_addr zone=hakimi_webhooks:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name bot.example.com;
    ssl_certificate /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_body_timeout 5s;
    access_log off;

    location ~ ^/webhooks/(onebot|qq)$ {
        limit_req zone=hakimi_webhooks burst=20 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:12141;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location = /ws/onebot {
        limit_req zone=hakimi_webhooks burst=5 nodelay;
        proxy_pass http://127.0.0.1:12141;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Self-ID $http_x_self_id;
        proxy_set_header X-Client-Role $http_x_client_role;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    # Admin remains SSH-tunnel-only; never proxy it through the public hostname.
    location = /admin { return 403; }
    location ^~ /admin/ { return 403; }
    location / { return 404; }
}
