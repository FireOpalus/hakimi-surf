services:
  hakimi-mc-server:
    container_name: hakimi-mc-server
    image: hakimi-mc-server:paper-26.1.2
    pull_policy: never
    ports:
      - "${MC_SERVER_PORT:-25565}:25565/tcp"
    volumes:
      - /opt/hakimi-mc-server/data:/data
    environment:
      - TZ=Asia/Shanghai
      - JVM_XMS=1024M
      - JVM_XMX=1280M
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1792m
    memswap_limit: 2048m
    cpus: 2.5
    pids_limit: 256
    oom_score_adj: 300
    stop_grace_period: 60s
    restart: unless-stopped
    networks:
      - hakimi_cn_net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  hakimi_cn_net:
    external: true
    name: hakimi-node-agent_hakimi_cn_net
