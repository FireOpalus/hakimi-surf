services:
  hakimi-node-agent:
    image: hakimi-node-agent:v2.1.0
    env_file: .env.node
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=700,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    networks:
      - hakimi_cn_net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  hakimi-mc-agent:
    image: hakimi-mc-agent:v2.1.0
    env_file: .env.mc
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=700,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    expose:
      - "8791"
    restart: unless-stopped
    networks:
      - hakimi_cn_net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  hakimi_cn_net:
    driver: bridge
