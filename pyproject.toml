[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hakimi-surf"
version = "2.1.0"
description = "Security-first asynchronous QQ assistant and controlled Bilibili text/video patrol"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=3.2.0,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "aiosqlite>=0.20,<1",
  "anyio>=4.6,<5",
  "cryptography>=44,<50",
  "websockets>=15,<18",
  "aiohttp>=3.11,<4",
  "pillow>=12,<13",
  "google-auth>=2.40,<3",
  # Retained in uv.lock for host scripts/colab_rvc.py CLI & smoke_container parity;
  # hakimi-bot runtime does not invoke yt-dlp (song_finder installs its own copy).
  "yt-dlp==2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-xdist>=3.6,<4", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hakimi", "src/hakimi_plugin_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["sqlite_durable: keep SQLite synchronous=FULL and secure_delete=ON"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# Platform repositories contribute to the same first-party Python namespace.
known-first-party = ["hakimi", "hakimi_plugin_sdk"]
